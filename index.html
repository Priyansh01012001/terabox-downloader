<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quick Player Instant Streaming</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif}
    body{background:#0b1120;color:#fff;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
    .container{width:100%;max-width:720px;margin-top:40px;text-align:center}
    h1{color:#38bdf8;font-size:26px;margin-bottom:8px}
    p{color:#94a3b8;font-size:14px;margin-bottom:18px}
    .input-group{display:flex;flex-direction:column;gap:12px}
    input[type="text"]{padding:14px;background:#1e293b;border:1px solid #334155;border-radius:8px;color:#fff;width:100%}
    button{padding:14px;background:#2563eb;color:#fff;border-radius:8px;border:none;cursor:pointer}
    #fileName{color:#38bdf8;margin:12px 0;word-break:break-all}
    .player-box{background:#000;border-radius:10px;overflow:hidden;border:1px solid #334155;margin-top:12px;display:none;padding:12px}
    video{width:100%;height:420px;background:#000}
    iframe{width:100%;height:420px;border:none;background:#000}
    .error-msg{color:#f87171;margin-top:12px;font-size:14px}
  </style>
</head>
<body>
  <div class="container">
    <h1>Quick Player Instant Streaming</h1>
    <p>Paste Terabox share link and play inside this page.</p>

    <div class="input-group">
      <input type="text" id="urlInput" placeholder="Paste Terabox link here (e.g., https://1024terabox.com/s/...)">
      <button id="extractBtn" onclick="extractVideo()">▶ Play Video</button>
    </div>

    <div id="errorBox" class="error-msg"></div>
    <div id="fileName"></div>

    <div class="player-box" id="playerBox">
      <!-- Use video for direct media. Use iframe for embed fallback. -->
      <video id="player" controls crossorigin="anonymous" style="display:none"></video>
      <iframe id="playerIframe" style="display:none" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    async function extractVideo() {
      const url = document.getElementById('urlInput').value.trim();
      const errorBox = document.getElementById('errorBox');
      const fileNameDiv = document.getElementById('fileName');
      const playerBox = document.getElementById('playerBox');
      const player = document.getElementById('player');
      const playerIframe = document.getElementById('playerIframe');
      const btn = document.getElementById('extractBtn');

      errorBox.innerText = '';
      fileNameDiv.innerText = '';
      playerBox.style.display = 'none';
      player.style.display = 'none';
      playerIframe.style.display = 'none';
      player.removeAttribute('src');
      playerIframe.removeAttribute('src');

      if (!url) {
        errorBox.innerText = 'Pehle Terabox ka link paste karo bhai!';
        return;
      }

      btn.innerText = 'Processing...';
      btn.disabled = true;

      try {
        const resp = await fetch('/api/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await resp.json();

        if (!resp.ok) {
          errorBox.innerText = data.error || 'Kuch gadbad ho gayi!';
        } else if (data.success) {
          fileNameDiv.innerText = data.fileName || 'Video';
          playerBox.style.display = 'block';

          if (data.isEmbed) {
            // embed fallback: show iframe
            playerIframe.src = data.downloadUrl;
            playerIframe.style.display = 'block';
            player.style.display = 'none';
          } else {
            // direct media: use proxied stream (this supports Range/CORS)
            player.src = data.downloadUrl;
            player.style.display = 'block';
            playerIframe.style.display = 'none';
            // try autoplay (may be blocked by browser), user can press play
            player.play().catch(()=>{});
          }
        } else {
          errorBox.innerText = data.error || 'Kuch gadbad ho gayi!';
        }
      } catch (err) {
        console.error(err);
        errorBox.innerText = 'Server error! Dobara try karo.';
      } finally {
        btn.innerText = '▶ Play Video';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
