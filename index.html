<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Player Instant Streaming</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            margin-top: 20px;
        }
        h2 { color: #38bdf8; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .result-box {
            margin-top: 20px;
            display: none;
            text-align: left;
        }
        video, iframe {
            width: 100%;
            height: 250px;
            border-radius: 8px;
            border: none;
            margin-top: 10px;
            background: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Quick Player Instant Streaming</h2>
        <p>Watch your Terabox links instantly and faster.</p>
        
        <input type="text" id="teraboxUrl" placeholder="Paste your Terabox link here...">
        <button onclick="extractVideo()">▶ Play Video</button>

        <div class="result-box" id="resultBox">
            <h3 id="fileName" style="font-size: 15px; color: #38bdf8;">Stream Ready:</h3>
            <div id="playerContainer"></div>
        </div>
    </div>

    <script>
        async function extractVideo() {
            let url = document.getElementById('teraboxUrl').value;
            if(!url) {
                alert("Pehle Terabox ka link toh daal bhai!");
                return;
            }

            let btn = document.querySelector('button');
            btn.innerText = "Extracting Stream...";
            btn.disabled = true;

            try {
                let response = await fetch('/api/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                let data = await response.json();
                
                if(data.success) {
                    let playerContainer = document.getElementById('playerContainer');
                    document.getElementById('resultBox').style.display = 'block';

                    if (data.downloadUrl.includes('.mp4') || data.downloadUrl.includes('.m3u8')) {
                        playerContainer.innerHTML = `<video controls autoplay src="${data.downloadUrl}"></video>`;
                    } else {
                        playerContainer.innerHTML = `<iframe src="${data.downloadUrl}" allowfullscreen></iframe>`;
                    }
                } else {
                    alert("Error: " + (data.error || "Extraction failed"));
                }
            } catch (err) {
                alert("Server issue! Please try again.");
            } finally {
                btn.innerText = "▶ Play Video";
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
