<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Terabox Quick Player</title>
  <style>
    body{background:#0b1120;color:#fff;font-family:Segoe UI,Arial;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center}
    .container{width:100%;max-width:720px}
    input{width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#0f1724;color:#fff;margin-bottom:10px}
    button{padding:12px 16px;border-radius:8px;border:none;background:#2563eb;color:#fff;cursor:pointer}
    .info{color:#94a3b8;margin-top:8px}
    .player{margin-top:12px;background:#000;border-radius:8px;padding:12px;border:1px solid #202632}
    video, iframe{width:100%;height:420px;background:#000;border:0}
    .fallback{margin-top:10px}
  </style>
</head>
<body>
  <div class="container">
    <h2>Terabox Quick Player</h2>
    <p class="info">Link paste karo — agar possible hua to yahin stream chalega, warna "Open on Terabox" dikhayenge.</p>
    <input id="link" placeholder="https://1024terabox.com/s/..." />
    <div style="display:flex;gap:8px">
      <button id="playBtn">Play</button>
      <button id="copyBtn">Copy Link</button>
    </div>
    <div id="meta" class="info"></div>

    <div class="player" id="playerWrap" style="display:none">
      <video id="player" controls style="display:none"></video>
      <iframe id="iframe" style="display:none"></iframe>
      <div id="fallback" class="fallback" style="display:none">
        <div id="fallbackText" style="color:#94a3b8"></div>
        <div style="margin-top:8px">
          <button id="openTeraboxBtn">Open on Terabox (new tab)</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let lastDownloadUrl = null;

    document.getElementById('copyBtn').addEventListener('click', () => {
      const v = document.getElementById('link').value.trim();
      if(!v) return alert('Link paste karo');
      navigator.clipboard.writeText(v).then(() => alert('Copied'));
    });

    document.getElementById('playBtn').addEventListener('click', doExtract);

    document.getElementById('openTeraboxBtn').addEventListener('click', () => {
      if(!lastDownloadUrl) return alert('No link');
      window.open(lastDownloadUrl, '_blank');
    });

    async function doExtract(){
      const url = document.getElementById('link').value.trim();
      if(!url) return alert('Link paste karo');
      document.getElementById('meta').innerText = 'Processing...';
      document.getElementById('playerWrap').style.display = 'none';
      try {
        const resp = await fetch('/api/extract', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ url })
        });
        const data = await resp.json();
        if(!resp.ok){ document.getElementById('meta').innerText = data.error || 'Error'; return; }
        document.getElementById('meta').innerText = `Filename: ${data.fileName || 'N/A'} ${data.sizeText ? '- ' + data.sizeText : ''}`;
        document.getElementById('playerWrap').style.display = 'block';
        if(data.isEmbed){
          if(data.embedAllowed){
            document.getElementById('iframe').src = data.downloadUrl;
            document.getElementById('iframe').style.display = 'block';
            document.getElementById('player').style.display = 'none';
            document.getElementById('fallback').style.display = 'none';
            lastDownloadUrl = data.downloadUrl;
          } else {
            document.getElementById('iframe').style.display = 'none';
            document.getElementById('player').style.display = 'none';
            document.getElementById('fallbackText').innerText = data.warning || 'Embedding blocked. Open on Terabox.';
            document.getElementById('fallback').style.display = 'block';
            lastDownloadUrl = data.downloadUrl;
          }
        } else {
          document.getElementById('player').src = data.downloadUrl;
          document.getElementById('player').style.display = 'block';
          document.getElementById('iframe').style.display = 'none';
          document.getElementById('fallback').style.display = 'none';
          lastDownloadUrl = data.downloadUrl;
          document.getElementById('player').play().catch(()=>{});
        }
      } catch (err) {
        console.error(err);
        document.getElementById('meta').innerText = 'Server error';
      }
    }
  </script>
</body>
</html>
